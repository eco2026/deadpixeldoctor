<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إصلاح الشاشة</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: black; /* خلفية كحلة باش يبان المربع مزيان */
            overflow: hidden;
            font-family: Arial, sans-serif;
            touch-action: none; /* باش نمنعو الصفحة من التحراك فالتليفون */
        }
        #damage-box {
            width: 50px;
            height: 50px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            cursor: move;
            z-index: 5;
            /* أنيماسيون باش الألوان يتبدلو بالزربة */
            animation: flash 0.1s infinite alternate; 
        }
        @keyframes flash {
            0% { background-color: white; }
            33% { background-color: red; }
            66% { background-color: green; }
            100% { background-color: blue; }
        }
        #exit-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #ff3333;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #exit-btn:hover {
            background-color: #cc0000;
        }
        #info-message {
            position: fixed;
            top: 20px;
            right: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="info-message">
        ⚠️ عافاك ماتنساش تطلع الإضاءة ديال الشاشة للماكسيموم بيدك.<br>
        جر المربع وحطو فوق البلاصة المتضررة.
    </div>
    
    <div id="damage-box"></div>
    
    <button id="exit-btn">خروج</button>

    <script>
        // --- 1. تحريك المربع (Draggable Box) ---
        const box = document.getElementById('damage-box');
        let isDragging = false;
        let startX, startY, initialX, initialY;

        // أحداث الماوس والتليفون
        box.addEventListener('mousedown', startDrag);
        box.addEventListener('touchstart', startDrag, {passive: false});

        function startDrag(e) {
            isDragging = true;
            if(e.type === 'touchstart') {
                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;
            } else {
                startX = e.clientX;
                startY = e.clientY;
            }
            initialX = box.offsetLeft;
            initialY = box.offsetTop;
            box.style.transform = 'translate(0, 0)'; // نحيدو التوسيط باش الحساب يجي مقاد
            box.style.left = initialX + 'px';
            box.style.top = initialY + 'px';
        }

        document.addEventListener('mousemove', drag);
        document.addEventListener('touchmove', drag, {passive: false});

        function drag(e) {
            if (!isDragging) return;
            e.preventDefault();
            let currentX, currentY;
            if(e.type === 'touchmove') {
                currentX = e.touches[0].clientX;
                currentY = e.touches[0].clientY;
            } else {
                currentX = e.clientX;
                currentY = e.clientY;
            }
            
            let dx = currentX - startX;
            let dy = currentY - startY;
            
            box.style.left = (initialX + dx) + 'px';
            box.style.top = (initialY + dy) + 'px';
        }

        document.addEventListener('mouseup', stopDrag);
        document.addEventListener('touchend', stopDrag);

        function stopDrag() {
            isDragging = false;
        }

        // --- 2. منع الشاشة من الانطفاء (Wake Lock API) ---
        let wakeLock = null;
        
        async function requestWakeLock() {
            try {
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('مزيان، الشاشة مغاديش تطفى دابا.');
                }
            } catch (err) {
                console.error(`وقع مشكل: ${err.name}, ${err.message}`);
            }
        }
        
        // نطلبوها أول مرة
        requestWakeLock();
        
        // نرجعوها يلا اليوزر خرج ورجع للصفحة
        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                requestWakeLock();
            }
        });

        // --- 3. زر الخروج ---
        const exitBtn = document.getElementById('exit-btn');
        exitBtn.addEventListener('click', () => {
            // نطلقو الشاشة باش ترجع تطفى عادي
            if (wakeLock !== null) {
                wakeLock.release().then(() => wakeLock = null);
            }
            
            // نخفيو كلشي ونعطيو رسالة
            document.body.innerHTML = "<h1 style='color:white; text-align:center; margin-top:20%; font-family:Arial;'>تم الخروج وإيقاف العملية. تقدر تسد الصفحة دابا.</h1>";
        });
    </script>
</body>
</html>
