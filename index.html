<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>مصلح البيكسل العالق</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: Tahoma, sans-serif;
            cursor: pointer;
        }
        #controls {
            position: absolute;
            z-index: 10;
            background: rgba(0, 0, 0, 0.8);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #555;
        }
        button {
            padding: 15px 30px;
            font-size: 20px;
            cursor: pointer;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 20px;
        }
        button:hover {
            background-color: #218838;
        }
        .warning {
            color: #ff4d4d;
            font-weight: bold;
            font-size: 18px;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div id="controls">
        <h2>برنامج إصلاح البيكسلات العالقة</h2>
        <p>هاد البرنامج غيبدا يبدل الألوان بالزربة باش يفيّق البيكسل المبلوكي.</p>
        <p>ملي تبغي توقفو، كليكي غير جوج مرات (Double Click) فاي بلاصة فديك الشاشة.</p>
        <p class="warning">⚠️ تحذير: هادشي ماصالحش للناس لي عندهم مرض الصرع (Epilepsy) ولا حساسية للضوء كيصني.</p>
        <button onclick="startFixer(event)">بدا العملية دابا</button>
    </div>

    <script>
        // الألوان لي غتبدل بالزربة
        const colors = ['#FF0000', '#00FF00', '#0000FF', '#FFFFFF', '#000000'];
        let i = 0;
        let interval;
        let isRunning = false;

        function startFixer(event) {
            event.stopPropagation(); // باش مايحسبش الكليك د البداية فحال كليك د التوقيف
            document.getElementById('controls').style.display = 'none';
            
            // نردوها شاشة كاملة باش تشد القنات كاملين
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen();
            }
            
            // سرعة تبدال الألوان (20 ميلي ثانية = سرعة قوية بزاف)
            interval = setInterval(() => {
                document.body.style.backgroundColor = colors[i];
                i = (i + 1) % colors.length;
            }, 20); 
            
            isRunning = true;
        }

        // باش نوقفو البرنامج يلا درنا دابل كليك
        document.body.addEventListener('dblclick', function() {
            if (isRunning) {
                clearInterval(interval);
                document.body.style.backgroundColor = 'black';
                document.getElementById('controls').style.display = 'block';
                
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                }
                isRunning = false;
            }
        });
    </script>

</body>
</html>
